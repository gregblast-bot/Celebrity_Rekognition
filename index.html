<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Celebrity Spotter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12 flex flex-col items-center">

    <header class="max-w-3xl w-full text-center mb-10">
        <h1 class="text-4xl md:text-6xl mb-4 pb-4 font-black tracking-tighter bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
            AI Celebrity Spotter
        </h1>
        <p class="mt-4 text-slate-400 font-medium">Please upload a photo for AI-powered celebrity recognition using Amazon Rekognition and Amazon Bedrock!</p>
    </header>

    <div class="max-w-2xl w-full mb-6 text-right relative">
        <button id="historyToggle" class="text-sm font-medium text-slate-400 hover:text-blue-400 transition-colors flex items-center gap-2 ml-auto">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            View Recent History
        </button>
        
        <div id="historyDropdown" class="hidden absolute right-0 mt-2 w-full glass rounded-2xl p-4 shadow-2xl z-50 max-h-64 overflow-y-auto border border-slate-700">
            <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Recent Recognitions</h3>
            <div id="historyList" class="space-y-2">
                <p class="text-sm text-slate-500 italic">Loading your history...</p>
            </div>
        </div>
    </div>

    <main class="max-w-2xl w-full">
        <div class="glass rounded-3xl p-8 shadow-2xl">
            <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-2xl p-10 text-center hover:border-blue-500 transition-all cursor-pointer bg-slate-800/50">
                <input type="file" id="fileInput" class="hidden" accept="image/*">
                <div id="Prompt">
                    <svg class="w-12 h-12 text-slate-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <p class="text-lg font-semibold">Click to select a photo</p>
                    <p class="text-sm text-slate-500 mt-1">Image File (jpeg, png, etc.)</p>
                </div>
                <div id="fileSelected" class="hidden">
                    <p class="text-blue-400 font-bold text-xl" id="selectedFileName"></p>
                    <p class="text-slate-400 text-sm mt-2">Ready to analyze...</p>
                </div>
            </div>

            <button id="analyzeBtn" class="w-full mt-8 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-3">
                <span>Start Recognition</span>
            </button>

            <button id="signOutBtn" class="w-full mt-4 bg-transparent border border-slate-600 hover:bg-slate-800 text-slate-400 font-medium py-2 rounded-xl transition-all text-sm">
                Sign Out
            </button>
        </div>

        <div id="statusArea" class="mt-8 hidden">
            <div class="flex items-center justify-center gap-4 text-slate-300">
                <div class="loader w-6 h-6 border-4 border-slate-700 rounded-full"></div>
                <p id="statusText">Generating secure link...</p>
            </div>
        </div>

        <div id="resultsGrid" class="mt-12 grid grid-cols-1 gap-6"></div>
    </main>

    <script>
        // COGNITO GATEKEEPER!
        const COGNITO_DOMAIN = "us-east-1vcj289mg8.auth.us-east-1.amazoncognito.com";
        const CLIENT_ID = "7no4d6v5f8k4qtjpm6ncqt3b0e"; 
        const REDIRECT_URI = "https://main.d3avkfapvvo9ac.amplifyapp.com";

        // Authentication check.
        const hash = window.location.hash;
        const urlParams = new URLSearchParams(hash.replace("#", "?"));
        const accessToken = urlParams.get("access_token");

        if (!accessToken) {
            // No token? Bounce to Cognito.
            const authUrl = `https://${COGNITO_DOMAIN}/login?client_id=${CLIENT_ID}&response_type=token&scope=email+openid+profile&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = authUrl;
        }

        // Core app logic.
        const API_BASE_URL = "https://z6kyirsp11.execute-api.us-east-1.amazonaws.com/prod";     
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const statusArea = document.getElementById('statusArea');
        const statusText = document.getElementById('statusText');
        const resultsGrid = document.getElementById('resultsGrid');

        // Helper to sign out.
        signOutBtn.onclick = () => {
            window.location.href = `https://${COGNITO_DOMAIN}/logout?client_id=${CLIENT_ID}&logout_uri=${encodeURIComponent(REDIRECT_URI)}`;
        };

        // Helper to reset UI.
        function resetUI() {
            analyzeBtn.disabled = false;
            statusArea.classList.add('hidden');
        }

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            if (e.target.files[0]) {
                document.getElementById('Prompt').classList.add('hidden');
                document.getElementById('fileSelected').classList.remove('hidden');
                document.getElementById('selectedFileName').innerText = e.target.files[0].name;
            }
        };

       analyzeBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Please select a file first.");
        
            analyzeBtn.disabled = true;
            statusArea.classList.remove('hidden');
            
            // Get the exact type, S3 is case sensitive. If missing, default to jpeg.
            const contentType = file.type || 'image/jpeg';
            console.log("Uploading with Content-Type:", contentType);
        
            try {
                statusText.innerText = "Authorizing S3...";
                const urlResponse = await fetch(`${API_BASE_URL}/update?fileName=${encodeURIComponent(file.name)}&contentType=${encodeURIComponent(contentType)}`);
                const responseData = await urlResponse.json();
                const uploadURL = responseData.uploadURL;
                const imageID = responseData.fileName;
        
                statusText.innerText = "Uploading image...";
                
                // This is the most compatible way to fetch for S3 Presigned URLs.
                const uploadResponse = await fetch(uploadURL, {
                    method: 'PUT',
                    body: file,
                    headers: {
                        'Content-Type': contentType
                    }
                });
        
                if (!uploadResponse.ok) {
                    throw new Error(`Upload failed with status: ${uploadResponse.status}`);
                }
        
                statusText.innerText = "AI is identifying celebrities...";
                pollForResults(imageID);
        
            } catch (err) {
                console.error("Upload Error:", err);
                alert("Upload failed. Check CORS or Network tab.");
                resetUI();
            }
        };
        
        async function pollForResults(imageID) {
            if (!imageID) {
                console.error("Cannot poll: imageID is undefined");
                return;
            }
        
            let attempts = 0;
            const maxAttempts = 20; 
        
            const interval = setInterval(async () => {
                attempts++;
                if (attempts > maxAttempts) {
                    clearInterval(interval);
                    statusText.innerText = "Analysis timed out.";
                    resetUI();
                    return;
                }
        
                try {
                    // Ensure imageID is a string,
                    const response = await fetch(`${API_BASE_URL}/results?imageID=${encodeURIComponent(imageID)}`);
                    
                    if (response.status === 200) {
                        const data = await response.json();
                        console.log("Results Found:", data);
                        clearInterval(interval);
                        displayResults(data);
                    } else {
                        console.log(`Attempt ${attempts}: Still processing...`);
                    }
                } catch (err) {
                    console.error("Polling error:", err);
                }
            }, 3000);
        }

        function displayResults(data) {
            resetUI();
            const resultsGrid = document.getElementById('resultsGrid');
            
            // Processor saves data in a list called 'CelebrityData'.
            const celebs = data.CelebrityData || [];

            if (celebs.length === 0) {
                resultsGrid.innerHTML = `
                    <div class="glass p-8 text-center rounded-2xl border border-yellow-500/30">
                        <p class="text-slate-400">No celebrities recognized. Try a clearer photo!</p>
                    </div>`;
                return;
            }

            resultsGrid.innerHTML = celebs.map(celeb => {
                // Ensure the URL is clean
                const cleanUrl = celeb.IMDB && celeb.IMDB !== "N/A" 
                    ? (celeb.IMDB.startsWith('http') ? celeb.IMDB : `https://${celeb.IMDB.trim()}`)
                    : null;

                return `
                    <div class="glass p-6 rounded-2xl border-l-4 border-blue-500 shadow-xl hover:scale-[1.02] transition-transform">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-xl font-bold text-white">${celeb.Name}</h3>
                            ${cleanUrl ? 
                                `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" 
                                    class="text-[10px] bg-yellow-500 text-black px-2 py-1 rounded font-black tracking-widest uppercase hover:bg-yellow-400 transition-colors">
                                    IMDb
                                </a>` 
                                : `<span class="text-[10px] text-slate-500 uppercase tracking-widest">No Bio Link</span>`
                            }
                        </div>
                        <p class="text-slate-300 italic mb-4 leading-relaxed">"${celeb.FunFact}"</p>
                        <div class="flex items-center gap-2">
                            <a href="${celeb.Social}" target="_blank" rel="noopener noreferrer" class="text-blue-400 text-xs hover:underline font-medium">
                                Search on X (Twitter) →
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // History display logic.
        const historyToggle = document.getElementById('historyToggle');
        const historyDropdown = document.getElementById('historyDropdown');
        const historyList = document.getElementById('historyList');

        historyToggle.onclick = async () => {
            // Toggle visibility
            const isHidden = historyDropdown.classList.toggle('hidden');
            
            if (!isHidden) {
                try {
                    const response = await fetch(`${API_BASE_URL}/history`); 
                    const historyData = await response.json();

                    if (!historyData || historyData.length === 0) {
                        historyList.innerHTML = `<p class="text-sm text-slate-500">No history found yet.</p>`;
                        return;
                    }

                    // Add this to block to handle clicking a history item.
                    function loadFromHistory(itemString) {
                        const item = JSON.parse(decodeURIComponent(itemString));
                        displayResults(item);
                        historyDropdown.classList.add('hidden'); // Close the menu
                    }

                    // Update the historyList.innerHTML mapping inside historyToggle.onclick.
                    historyList.innerHTML = historyData.map(item => {
                        const safeItem = encodeURIComponent(JSON.stringify(item));
                        return `
                            <div class="flex items-center justify-between p-3 rounded-xl bg-slate-800/40 border border-slate-700/50 hover:bg-slate-700/50 transition-all cursor-pointer" 
                                onclick="loadFromHistory('${safeItem}')">
                                <div>
                                    <p class="text-sm font-bold text-blue-400">
                                        ${item.CelebrityName || 'Recognition Result'}
                                    </p>
                                    <p class="text-[10px] text-slate-500">ID: ${item.ImageID.substring(0,8)}...</p>
                                </div>
                                <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        `;
                    }).join('');

                } catch (err) {
                    console.error("History fetch error:", err);
                    historyList.innerHTML = `<p class="text-sm text-red-400">Failed to load history.</p>`;
                }
            }

            // Close dropdown when clicking outside.
            window.addEventListener('click', (e) => {
                if (!historyToggle.contains(e.target) && !historyDropdown.contains(e.target)) {
                    historyDropdown.classList.add('hidden');
                }
        });
    };
    </script>
</body>
</html>
